<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Clock</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07090d;
        --text: #e8eefc;
        --muted: #94a3b8;
        --accent: #5eead4;
        --line: rgba(148, 163, 184, 0.16);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: radial-gradient(70% 60% at 50% 0%, rgba(94, 234, 212, 0.14), transparent 70%), var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }

      main {
        width: min(520px, 100%);
        padding: clamp(1.5rem, 5vw, 3rem);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.03);
      }

      .label {
        font-size: 0.72rem;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--accent);
      }

      #time {
        margin-top: 0.8rem;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: clamp(3.2rem, 14vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      #date {
        margin-top: 0.9rem;
        color: var(--muted);
        font-size: 1rem;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 0.6rem;
        margin-top: 1.8rem;
      }

      button {
        padding: 0.6rem 1rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: inherit;
        font-size: 0.82rem;
        cursor: pointer;
      }

      button:hover {
        border-color: rgba(94, 234, 212, 0.5);
      }

      #zone {
        margin-top: 1.2rem;
        color: var(--muted);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Focus Clock</p>
      <div id="time">--:--</div>
      <p id="date">Loading date…</p>
      <div class="controls">
        <button id="formatButton" type="button">24-hour</button>
        <button id="zoneButton" type="button">Show time zone</button>
      </div>
      <p id="zone" hidden></p>
    </main>
    <script>
      const timeElement = document.querySelector("#time");
      const dateElement = document.querySelector("#date");
      const zoneElement = document.querySelector("#zone");
      const formatButton = document.querySelector("#formatButton");
      const zoneButton = document.querySelector("#zoneButton");
      let use24Hour = true;

      function render() {
        const now = new Date();
        timeElement.textContent = now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: !use24Hour,
        });
        dateElement.textContent = now.toLocaleDateString([], {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });
        zoneElement.textContent = `${Intl.DateTimeFormat().resolvedOptions().timeZone} · UTC${now.getTimezoneOffset() <= 0 ? "+" : "-"}${String(Math.abs(now.getTimezoneOffset() / 60)).padStart(2, "0")}`;
      }

      formatButton.addEventListener("click", () => {
        use24Hour = !use24Hour;
        formatButton.textContent = use24Hour ? "24-hour" : "12-hour";
        render();
      });

      zoneButton.addEventListener("click", () => {
        zoneElement.hidden = !zoneElement.hidden;
        zoneButton.textContent = zoneElement.hidden ? "Show time zone" : "Hide time zone";
      });

      render();
      setInterval(render, 1000);
    </script>
  </body>
</html>
