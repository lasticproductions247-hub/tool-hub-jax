<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07090d;
        --text: #e8eefc;
        --muted: #94a3b8;
        --accent: #f472b6;
        --line: rgba(148, 163, 184, 0.16);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: radial-gradient(70% 60% at 50% 0%, rgba(244, 114, 182, 0.16), transparent 70%), var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }

      main {
        width: min(520px, 100%);
        padding: clamp(1.5rem, 5vw, 3rem);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.03);
      }

      .label {
        font-size: 0.72rem;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--accent);
      }

      #time {
        margin: 1rem 0 0.4rem;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: clamp(3.4rem, 15vw, 6.5rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      #hint {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .bar {
        height: 6px;
        margin: 1.6rem 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      #progress {
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), #818cf8);
        transition: width 0.3s linear;
      }

      .presets,
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.6rem;
      }

      .presets {
        margin-bottom: 1rem;
      }

      button {
        padding: 0.6rem 1rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: inherit;
        font-size: 0.82rem;
        cursor: pointer;
        transition: border-color 0.18s ease, background 0.18s ease;
      }

      button:hover {
        border-color: rgba(244, 114, 182, 0.55);
      }

      button.is-active {
        color: #101014;
        background: var(--accent);
        border-color: transparent;
      }

      .primary {
        color: #101014;
        background: var(--accent);
        border-color: transparent;
        min-width: 7.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Focus Timer</p>
      <div id="time">25:00</div>
      <p id="hint">Ready when you are.</p>

      <div class="bar"><div id="progress"></div></div>

      <div class="presets">
        <button data-minutes="5" type="button">5 min</button>
        <button data-minutes="15" type="button">15 min</button>
        <button class="is-active" data-minutes="25" type="button">25 min</button>
        <button data-minutes="45" type="button">45 min</button>
      </div>

      <div class="controls">
        <button class="primary" id="startButton" type="button">Start</button>
        <button id="resetButton" type="button">Reset</button>
      </div>
    </main>
    <script>
      const timeElement = document.querySelector("#time");
      const hintElement = document.querySelector("#hint");
      const progressElement = document.querySelector("#progress");
      const startButton = document.querySelector("#startButton");
      const resetButton = document.querySelector("#resetButton");
      const presetButtons = Array.from(document.querySelectorAll("[data-minutes]"));

      let totalSeconds = 25 * 60;
      let remainingSeconds = totalSeconds;
      let intervalId = null;

      function format(seconds) {
        const minutes = Math.floor(seconds / 60);
        const rest = seconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(rest).padStart(2, "0")}`;
      }

      function render() {
        timeElement.textContent = format(remainingSeconds);
        const elapsed = totalSeconds - remainingSeconds;
        progressElement.style.width = `${(elapsed / totalSeconds) * 100}%`;
        document.title = `${format(remainingSeconds)} · Focus Timer`;
      }

      function stop() {
        clearInterval(intervalId);
        intervalId = null;
        startButton.textContent = "Start";
      }

      function tick() {
        if (remainingSeconds <= 0) {
          stop();
          remainingSeconds = 0;
          hintElement.textContent = "Time is up. Nice work.";
          render();
          return;
        }
        remainingSeconds -= 1;
        render();
      }

      startButton.addEventListener("click", () => {
        if (intervalId) {
          stop();
          hintElement.textContent = "Paused.";
          return;
        }
        if (remainingSeconds <= 0) remainingSeconds = totalSeconds;
        hintElement.textContent = "Focusing…";
        startButton.textContent = "Pause";
        intervalId = setInterval(tick, 1000);
      });

      resetButton.addEventListener("click", () => {
        stop();
        remainingSeconds = totalSeconds;
        hintElement.textContent = "Ready when you are.";
        render();
      });

      presetButtons.forEach((button) => {
        button.addEventListener("click", () => {
          stop();
          presetButtons.forEach((item) => item.classList.toggle("is-active", item === button));
          totalSeconds = Number(button.dataset.minutes) * 60;
          remainingSeconds = totalSeconds;
          hintElement.textContent = "Ready when you are.";
          render();
        });
      });

      render();
    </script>
  </body>
</html>
